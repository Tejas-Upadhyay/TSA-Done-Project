[platformio]
src_dir = firmware/drone_firmware

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags = -Wall -Wextra

[env:esp32dev]
build_src_filter = +<*> -<debug_entry.cpp>

[env:esp32debug]
build_src_filter = -<*> +<debug_entry.cpp>

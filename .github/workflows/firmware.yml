name: Firmware checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - run: g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tests/flight_core_test.cpp -o /tmp/flight-tests
      - run: /tmp/flight-tests
      - run: g++ -std=c++17 -Wall -Wextra -Werror -Itests/fakes tests/debug_test.cpp -o /tmp/debug-tests
      - run: /tmp/debug-tests
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile tools/ble_bench.py tools/ble_gamepad.py
      - run: python -m platformio run
